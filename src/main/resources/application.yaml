spring:
  application:
    name: zylos-service-cart
  threads:
    virtual:
      enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
  grpc:
    client:
      channel:
        catalog:
          target: ${CATALOG_GRPC_ADDRESS}
  data:
    redis:
      host: ${ZYLOS_VALKEY_HOST}
      port: ${ZYLOS_VALKEY_PORT}
      password: ${ZYLOS_VALKEY_PASSWORD}
  security:
    oauth2:
      client:
        registration:
          zylos-internal:
            client-id: ${S2S_CLIENT_ID:zylos-internal}
            client-secret: ${S2S_CLIENT_SECRET}
            authorization-grant-type: client_credentials
            provider: keycloak
        provider:
          keycloak:
            token-uri: ${KEYCLOAK_TOKEN_URI}

zylos:
  catalog:
    grpc:
      deadline-ms: 150
      s2s-registration-id: "zylos-internal"
    cache:
      key-prefix: "cart:catalog:sku:"
      found-fresh-seconds: 90
      found-hard-seconds: 86400
      negative-fresh-seconds: 10
      negative-hard-seconds: 60
    resilience:
      cb-failure-rate-threshold: 50
      cb-sliding-window: 20
      cb-wait-open-seconds: 5
      bulkhead-max-concurrent: 32
      retry-max-attempts: 2
      retry-base-ms: 50
  cart:
    idempotency:
      path-prefix: /api/v1/cart
      in-flight-ttl-seconds: 60
      completed-ttl-hours: 24
    concurrency:
      retry:
        max-attempts: 4
        base-ms: 20
    events-topic: cart.cart.events.v1
    snapshot-topic: cart.cart.snapshot.v1
    relay:
      poll-interval-ms: 1000
      batch-size: 100
      lease-ttl-seconds: 30
      lease-safety-margin-ms: 5000
      lease-renew-every-records: 20
      send-timeout-seconds: 10
      published-retention-hours: 24
    reaper:
      batch-size: 200
      rate-limit:
        max-writes-per-second: 50
        timeout: 10s
      retry:
        max-attempts: 3
        wait-duration: 500ms
    outbox:
      write-shards: 16
      read-shards: 16
    expiry:
      write-shards: 8
      read-shards: 8
  kafka:
    schema-registry-url: ${SCHEMA_REGISTRY_URL}
    auto-register-schemas: ${SCHEMA_AUTO_REGISTER:true}
  dynamodb:
    table-name: zylos-cart
    endpoint: ${DYNAMODB_ENDPOINT}
  aws:
    region: ${AWS_REGION:us-east-1}
  service:
    name: ${spring.application.name}
    version: ${SERVICE_VERSION:0.0.0}

management:
  server:
    port: 9000
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics,reaper
      base-path: /actuator
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
    circuitbreakers:
      enabled: true
  info:
    git:
      mode: full
  metrics:
    tags:
      application: ${spring.application.name}
  opentelemetry:
    resource-attributes:
      service.name: ${spring.application.name}
      service.version: ${app.version:unknown}
      deployment.environment: ${spring.profiles.active}
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT}
  otlp:
    metrics:
      export:
        enabled: true
        url: ${OTEL_EXPORTER_OTLP_METRICS_ENDPOINT}

app:
  version: "@project.version@"
